apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      containers:
      - name: airflow-scheduler
        image: rohit2101991/airflow-databricks:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - |
            airflow db upgrade &&
            airflow scheduler
        env:
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
        volumeMounts:
        - name: airflow-logs
          mountPath: /opt/airflow/logs
      volumes:
      - name: airflow-logs
        emptyDir: {}


